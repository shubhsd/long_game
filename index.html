<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Long Game — Campaign</title>
<style>
:root{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --raised:#232322; --sunken:#141413;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --line:rgba(255,255,255,.10); --grid:#2c2c2a;
  --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500;
  --p4:#d55181; --p5:#008300; --p6:#9085e9; --p7:#e66767; --pN:#a3a099;
  --blue:#3987e5; --aqua:#199e70; --gold:#c98500; --violet:#9085e9; --red:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --r:14px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --page:#f4f4f1; --surface:#fcfcfb; --raised:#ffffff; --sunken:#eeeeea;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --line:rgba(11,11,11,.10); --grid:#e1e0d9;
  --p0:#2a78d6; --p1:#eb6834; --p2:#1baf7a; --p3:#eda100;
  --p4:#e87ba4; --p5:#008300; --p6:#4a3aa7; --p7:#e34948; --pN:#6f6d67;
  --blue:#2a78d6; --aqua:#1baf7a; --gold:#eda100; --violet:#4a3aa7; --red:#e34948;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 110px}
h2.sec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin:0 0 10px;font-weight:700}
.mini{font-size:12.5px;color:var(--ink-2)} .dim{color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--raised);
  color:var(--ink-1);padding:7px 13px;font-size:13px;transition:.12s}
button:hover{background:var(--grid)}
button.primary{background:var(--blue);color:#fff;border-color:transparent;font-weight:650}
button.primary:hover{filter:brightness(1.1)}
button.ghost{background:transparent;border-style:dashed;color:var(--ink-2);font-size:12px;padding:5px 10px}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--page) 90%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-bottom:16px}
.barIn{max-width:960px;margin:0 auto;padding:9px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.stat{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.stat b{color:var(--ink-1);font-size:14px}
.sp{flex:1}
.grp{display:flex;gap:8px;align-items:center;margin-left:auto}
@media(max-width:900px){.brand{font-size:14px}.stat{font-size:11.5px;padding:3px 9px}}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:11px;border:1px solid var(--line)}
.tabs button{border:none;background:transparent;padding:6px 14px;border-radius:8px;color:var(--ink-2);font-size:13px}
.tabs button.on{background:var(--blue);color:#fff;font-weight:650}

/* hero */
.hero{background:linear-gradient(140deg,var(--surface),var(--sunken));border:1px solid var(--line);
  border-radius:18px;padding:22px 24px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 210px at 88% -30%, color-mix(in srgb,var(--accent,var(--blue)) 26%,transparent), transparent 70%)}
.heroTop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative}
.lvlbadge{display:flex;align-items:center;gap:13px;min-width:0}
.lvlnum{width:62px;height:62px;border-radius:17px;color:#fff;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-weight:800;line-height:1;flex:0 0 auto}
.lvlnum small{font-size:9px;font-weight:700;letter-spacing:.1em;opacity:.85;margin-bottom:3px}
.lvlnum b{font-size:25px}
.lvltitle{font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.lvlmeta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.pips{display:flex;gap:16px;flex-wrap:wrap}
.pip{text-align:right}.pip .v{font-size:20px;font-weight:750;letter-spacing:-.02em}
.pip .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.xpwrap{margin-top:20px;position:relative}
.xpbar{height:16px;border-radius:99px;background:var(--sunken);border:1px solid var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent,var(--blue)),var(--aqua));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.marks{position:relative;height:18px;margin-top:4px;font-size:10px;color:var(--ink-3)}
.marks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marks span:before{content:"";position:absolute;left:50%;top:-24px;width:1px;height:18px;background:var(--ink-3);opacity:.5}
.xpline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:24px;gap:10px;flex-wrap:wrap}
.navrow{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap}

/* quests */
.quest{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:14px;overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;padding:13px 18px;background:var(--sunken);border-bottom:1px solid var(--line);cursor:pointer}
.qhead:hover{background:var(--grid)}
.qicon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.qtitle{font-weight:700;font-size:15px;flex:1;min-width:0}
.qtitle small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:1px}
.qxp{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--raised);padding:3px 10px;
  border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.qbody{padding:14px 18px 18px}
.locked{opacity:.6}
.locked .qhead{background:repeating-linear-gradient(135deg,var(--sunken),var(--sunken) 9px,var(--surface) 9px,var(--surface) 18px)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.5}
.ck:hover{background:color-mix(in srgb,var(--grid) 45%,transparent)}
.ck input{margin-top:3px;flex:0 0 auto}
.ck.on span.t{color:var(--ink-3);text-decoration:line-through}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.prow{display:flex;gap:9px;align-items:center;padding:8px;border-radius:9px;flex-wrap:wrap;border-bottom:1px solid var(--grid)}
.prow:last-child{border-bottom:none}
.prow.on{opacity:.62}.prow.on .pn{text-decoration:line-through}
.pn{flex:1;min-width:150px;font-size:13.5px}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.t-must{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.t-rec{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue)}
.t-bonus{background:var(--grid);color:var(--ink-3)}
.t-E{color:var(--good);font-weight:800;font-size:11px}
.t-M{color:var(--warn);font-weight:800;font-size:11px}
.t-H{color:var(--crit);font-weight:800;font-size:11px}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:13px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--sunken);color:var(--ink-1);max-width:100%}
select.out{font-size:11.5px;padding:4px 7px}
textarea{width:100%;min-height:56px;resize:vertical}
.xpgain{font-size:11px;font-weight:700;color:var(--aqua);min-width:40px;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
@media(max-width:820px){.days{grid-template-columns:repeat(2,1fr)}}
.day{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--sunken);cursor:pointer}
.day:hover{border-color:var(--blue)}
.day.on{background:color-mix(in srgb,var(--good) 16%,transparent);border-color:var(--good)}
.day .d{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.day.on .d{color:var(--good)}
.day .m{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.4}
.day .tick{float:right;font-size:13px}
.boss{border:1px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;
  background:linear-gradient(140deg,color-mix(in srgb,var(--red) 12%,transparent),transparent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.seg button{border:none;border-radius:0;background:var(--sunken);color:var(--ink-2);padding:8px 15px}
.seg button.on{background:var(--red);color:#fff;font-weight:700}
.mvw{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 11%,transparent);
  border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-bottom:14px}
.note{border-left:3px solid var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);
  border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0;font-size:13px;color:var(--ink-2)}
.note.gold{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.note.red{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 11%,transparent)}
.gradebox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gradeltr{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:800;background:var(--grid);color:var(--ink-3);flex:0 0 auto}
.gS{background:var(--violet);color:#fff}.gA{background:var(--good);color:#fff}
.gB{background:var(--blue);color:#fff}.gC{background:var(--warn);color:#0b0b0b}.gD{background:var(--crit);color:#fff}
.gate{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;padding:4px 0;color:var(--ink-2)}
.pass{color:var(--good)}.fail{color:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;
  padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--grid)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.report{width:100%;min-height:250px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--sunken);border:1px solid var(--line);border-radius:11px;padding:13px;color:var(--ink-1)}

/* ── CAMPAIGN MAP ── */
.chapter{margin-bottom:24px}
.chTitle{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.chDot{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.chName{font-weight:750;font-size:14.5px}
.chMeta{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:9px}
.tile{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:12px 13px;
  cursor:pointer;position:relative;transition:.14s;min-height:96px;display:flex;flex-direction:column;gap:5px}
.tile:hover{transform:translateY(-2px);border-color:var(--accent2)}
.tile .tn{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--ink-3)}
.tile .tt{font-size:13px;font-weight:650;line-height:1.32}
.tile .tb{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile.lock{cursor:not-allowed;background:var(--sunken)}
.tile.lock .tt{color:var(--ink-3);font-weight:500}
.tile.lock:hover{transform:none;border-color:var(--line)}
.tile.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue), 0 8px 26px color-mix(in srgb,var(--blue) 22%,transparent)}
.tile.done{background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.lockico{position:absolute;top:11px;right:12px;font-size:13px;opacity:.6}
.gbadge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.chip{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--grid);color:var(--ink-3);
  letter-spacing:.04em;text-transform:uppercase}
.pbar{height:4px;border-radius:99px;background:var(--grid);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--good)}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.badge{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--sunken);display:flex;gap:11px;align-items:flex-start}
.badge.got{background:color-mix(in srgb,var(--gold) 13%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.badge .e{font-size:20px;line-height:1;filter:grayscale(1);opacity:.45}
.badge.got .e{filter:none;opacity:1}
.badge .n{font-weight:700;font-size:13px}
.badge .d2{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.admOn{background:var(--gold)!important;color:#0b0b0b!important;border-color:transparent!important;font-weight:800}
.adm-banner{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 13%,transparent);
  border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.lvdet{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.lvdet>summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;gap:11px;align-items:center}
.lvdet>summary::-webkit-details-marker{display:none}
.lvdet>summary:hover{background:var(--grid)}
.lvdet .lb{width:4px;align-self:stretch;border-radius:2px;min-height:34px;flex:0 0 auto}
.lvdet .ln{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;font-size:12px;letter-spacing:.05em}
.lvdet .lt{flex:1;min-width:0;font-weight:650;font-size:14px}
.lvdet .lt small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:1px}
.lvdet .lm{font-size:11px;color:var(--ink-3);white-space:nowrap}
.lvdet .db{padding:4px 18px 18px;border-top:1px solid var(--line)}
.dsect{margin-top:14px}
.dsect h5{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700}
.dsect ul{margin:4px 0;padding-left:19px;color:var(--ink-2);font-size:13px}
.dsect ul li{margin-bottom:2px}
.plist{font-size:13px}
.plist div{padding:3px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kv{font-size:13px;color:var(--ink-2)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:none;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow:auto;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.mbody{padding:18px}
.mtabs{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.mtabs button{border:none;background:transparent;padding:6px 12px;border-radius:7px;color:var(--ink-2);font-size:12.5px}
.mtabs button.on{background:var(--blue);color:#fff;font-weight:650}
.datatxt{width:100%;min-height:190px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink-1);white-space:pre}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);z-index:99;
  background:var(--ink-1);color:var(--page);padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;
  box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="bar"><div class="barIn">
  <span class="brand">🎮 The Long Game</span>
  <span class="stat">⚡ <b id="sMeta">Lv 1</b> <span id="sXp"></span></span>
  <span class="stat">🔥 <b id="sStreak">0</b> streak</span>
  <span class="stat">🏆 <b id="sCleared">0</b>/58 cleared</span>
  <span class="sp"></span>
  <div class="grp">
    <div class="tabs"><button class="on" data-v="v-level">Current level</button><button data-v="v-map">Campaign map</button><button data-v="v-ach">Trophies</button><button data-v="v-adm" id="tabAdm" style="display:none">🛠 Curriculum</button></div>
    <button onclick="askAdmin()" id="admBtn" title="Admin / curriculum browser">⚙</button>
    <button onclick="openData('reset')" id="rstBtn" title="Reset & repair (admin)" style="display:none;border-color:var(--crit);color:var(--crit)">🧨</button>
    <button onclick="toggleTheme()" title="Light / dark">◐</button>
    <button onclick="openData('backup')" title="Backup, restore and exports">💾</button>
    <input id="fi" type="file" accept=".json" style="display:none">
  </div>
</div></div>

<div class="wrap">
  <div id="storeNote"></div>
  <div class="view" id="v-level"></div>
  <div class="view" id="v-map" style="display:none"></div>
  <div class="view" id="v-ach" style="display:none"></div>
  <div class="view" id="v-adm" style="display:none"></div>
</div>
<div class="modal" id="modal"><div class="mbox">
  <div class="mhead"><b id="mTitle">Data</b><button onclick="closeModal()">✕</button></div>
  <div class="mbody" id="mBody"></div>
</div></div>
<div class="modal" id="dlg" style="z-index:90"><div class="mbox" style="max-width:460px">
  <div class="mhead"><b id="dTitle">…</b><button onclick="dlgClose(null)">✕</button></div>
  <div class="mbody">
    <div id="dMsg" class="mini" style="line-height:1.55"></div>
    <input type="text" id="dInput" style="width:100%;margin-top:12px;display:none">
    <div id="dErr" class="mini" style="color:var(--crit);margin-top:8px;display:none"></div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:flex-end">
      <button id="dCancel" onclick="dlgClose(null)">Cancel</button>
      <button class="primary" id="dOk" onclick="dlgOk()">OK</button>
    </div>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const PHASES=[
 {i:0,name:"Programming Foundations (warm-up)",short:"P0 · Programming Basics",v:"--pN"},
 {i:1,name:"DSA Foundations & Problem-Solving Basics",short:"P1 · DSA Foundations",v:"--p0"},
 {i:2,name:"Core Data Structures",short:"P2 · Core DS",v:"--p1"},
 {i:3,name:"Core Patterns ‖ LLD Foundations",short:"P3 · Patterns + LLD",v:"--p2"},
 {i:4,name:"Advanced DSA ‖ LLD Patterns",short:"P4 · Advanced DSA",v:"--p3"},
 {i:5,name:"LLD Machine-Coding Intensive",short:"P5 · LLD Intensive",v:"--p4"},
 {i:6,name:"HLD / System Design Fundamentals",short:"P6 · HLD Fundamentals",v:"--p5"},
 {i:7,name:"System Design Case Studies",short:"P7 · Case Studies",v:"--p6"},
 {i:8,name:"Interview Preparation",short:"P8 · Interview Prep",v:"--p7"}
];
const ROADMAP=[
/* ─────────── PHASE 1 · DSA FOUNDATIONS (W4–16) ─────────── */
/* ─────────── PHASE 0 · PROGRAMMING FOUNDATIONS — warm-up (W1–3) ─────────── */
/* You have 8 years of engineering experience, so this is fluency work, not learning-to-code.
   The goal is to make loops, conditionals and containers automatic IN THE DSA IDIOM, so that
   from W4 onward your brain is spending 100% of its budget on the algorithm and 0% on syntax.

/* ═══════════════════ CAMPAIGN ENGINE ═══════════════════ */
const START=new Date(2026,7,17);
const XP={concept:5,lecture:12,E:15,M:25,H:40,mustBonus:5,rev:20,sdc:5,sdx:25,mission:5,
  boss:{clear:110,attempt:40},reflection:15,mult:{ind:1.5,hint:1.0,std:0.6}};
const CLEAR_PCT=60, SURVIVE_PCT=32, S_PCT=92;
const REVIEW_OFFSETS=[7,30,90];
const STAGE_LABEL=["+7 day","+30 day","+90 day","retired"];
const KEY="longgame.campaign.v1";
const TIER={1:"must",2:"rec",3:"bonus"};
const DIFFXP={E:XP.E,M:XP.M,H:XP.H};

let S={v:1,levels:{},reviews:[],unlocked:{1:true},manual:{},seenAch:{},cur:1,theme:null};
let mem=false, view="v-level";

/* ---------- storage ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=true}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S=Object.assign(S,d);}}catch(e){mem=true}}
function L(n){if(!S.levels[n])S.levels[n]={};const x=S.levels[n];
  ["c","lec","pr","prd","rev","ms","bonus","sdc","sdx"].forEach(k=>{if(!x[k])x[k]={}});return x;}

/* ---------- dates ---------- */
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const wkFrom=n=>addDays(START,(n-1)*7);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R=n=>ROADMAP[n-1];
const pv=i=>PHASES[i].v;
function toast(m){const t=document.getElementById("toast");t.innerHTML=m;t.classList.add("show");
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),3000);}

/* ---------- generated content ---------- */
function missionsFor(n){
  const d=R(n), must=d.pr.filter(p=>p[2]===1), rec=d.pr.filter(p=>p[2]===2);
  const chunk=(arr,i,k)=>arr.slice(i,i+k).map(p=>p[0]).join(" · ")||"catch up on anything outstanding";
  const per=Math.max(1,Math.ceil(must.length/4));
  const two=d.sd?` + ${d.sd.h.split("·")[0].trim()} block`:"";
  return [
   ["Mon","Lecture / concept block (1 h). Then: "+chunk(must,0,per)],
   ["Tue","Concepts continued. Then: "+chunk(must,per,per)],
   ["Wed","Concepts finish. Then: "+chunk(must,per*2,per)],
   ["Thu",(must.length>per*3?"Then: "+chunk(must,per*3,per):"Finish the MUST list")+". Write your insight lines."],
   ["Fri","Light day: clear the revision queue + 15-minute retro. Then stop."],
   ["Sat","Deep block (3–4 h): hardest material"+two+". Then: "+(rec.length?rec.slice(0,2).map(p=>p[0]).join(" · "):"re-solve anything shaky")],
   ["Sun","Boss Battle + reflection + preview the next level (2–3 h)"]
  ];
}
function bonusFor(n){
  const d=R(n);
  const b=[["Re-solve one problem from this level with zero reference, timed",15],
           ["Write the topic's “when do I reach for this?” note in your own words",10],
           ["Explain this level's main pattern out loud for 3 minutes, recorded",10]];
  if(d.pr.some(p=>p[2]===3)) b.push(["Clear a BONUS-tier problem",20]);
  if(d.tg.includes("Mock")) b.push(["Watch your mock recording back and write 3 lines",20]);
  return b;
}
function speedrunFor(n){
  const d=R(n);
  if(d.ph===0) return "<b>⚡ Speedrun clause.</b> You have eight years of experience — if you clear the Boss Battle by Wednesday with every MUST problem at 🟢 independent, bank this level early and open the next one the same week. Do <i>not</i> skip the repo/notes setup, though: that is the part that compounds.";
  if(d.tg.includes("Deload")) return "<b>🛟 Deload level.</b> This one is <i>meant</i> to be light. Taking it fully is the correct play — deloads work because you take them before you need them, not after.";
  if(d.tg.includes("Revision")) return "<b>🔁 Consolidation level.</b> No new topics by design. Re-solve, never re-read. If something is still shaky here, that is the signal to insert a repair week rather than push on.";
  return "";
}

/* ---------- scoring ---------- */
function probXP(p,outcome){return Math.round((DIFFXP[p[1]]+(p[2]===1?XP.mustBonus:0))*XP.mult[outcome]);}
function probMax(p){return probXP(p,"ind");}
function scoreOf(n){
  const d=R(n), st=L(n);
  let got=0,max=0;
  d.c.forEach((_,i)=>{max+=XP.concept;if(st.c[i])got+=XP.concept;});
  d.lec.forEach((_,i)=>{max+=XP.lecture;if(st.lec[i])got+=XP.lecture;});
  let done=0,ind=0,hint=0,std=0,mustDone=0;
  const musts=d.pr.filter(p=>p[2]===1).length;
  d.pr.forEach((p,i)=>{max+=probMax(p);const e=st.pr[i];
    if(e){done++;got+=probXP(p,e);if(e==="ind")ind++;else if(e==="hint")hint++;else std++;if(p[2]===1)mustDone++;}});
  (d.rv||[]).forEach((_,i)=>{max+=XP.rev;if(st.rev[i])got+=XP.rev;});
  let sdcT=0,sdxT=0,sdcD=0,sdxD=0;
  if(d.sd){d.sd.c.forEach((_,i)=>{max+=XP.sdc;sdcT++;if(st.sdc[i]){got+=XP.sdc;sdcD++;}});
           d.sd.x.forEach((_,i)=>{max+=XP.sdx;sdxT++;if(st.sdx[i]){got+=XP.sdx;sdxD++;}});}
  missionsFor(n).forEach((_,i)=>{max+=XP.mission;if(st.ms[i])got+=XP.mission;});
  max+=XP.boss.clear;
  if(st.boss==="clear")got+=XP.boss.clear;else if(st.boss==="attempt")got+=XP.boss.attempt;
  max+=XP.reflection;
  const reflected=(st.well||"").trim().length>3&&(st.struggle||"").trim().length>3;
  if(reflected)got+=XP.reflection;
  let bonusXP=0;bonusFor(n).forEach((b,i)=>{if(st.bonus[i])bonusXP+=b[1];});
  got+=bonusXP;
  return {got,max,done,ind,hint,std,mustDone,musts,bonusXP,reflected,
    indShare:done?ind/done:0,total:d.pr.length,
    conDone:d.c.filter((_,i)=>st.c[i]).length,conTot:d.c.length,
    lecDone:d.lec.filter((_,i)=>st.lec[i]).length,lecTot:d.lec.length,
    revDone:(d.rv||[]).filter((_,i)=>st.rev[i]).length,revTot:(d.rv||[]).length,
    sdcD,sdcT,sdxD,sdxT,
    msDone:missionsFor(n).filter((_,i)=>st.ms[i]).length,
    pct:0};
}
function gradeOf(n){
  const s=scoreOf(n),st=L(n);
  const pct=s.max?100*Math.min(s.got,s.max)/s.max:0;
  s.pct=pct;
  let g=s.got===0?null:(pct>=92?"S":pct>=80?"A":pct>=65?"B":pct>=45?"C":"D");
  const bossOK=st.boss==="clear";
  const indOK=s.done<4||s.indShare>=0.40;
  const mustOK=s.musts===0||s.mustDone/s.musts>=0.8;
  if(g){if(!mustOK&&"SAB".includes(g))g="C"; if((!bossOK||!indOK)&&"SA".includes(g))g="B";}
  return {g,pct,s,gates:[
    {ok:bossOK,t:"Boss Battle cleared",f:"Caps you at B until the boss is beaten."},
    {ok:indOK,t:"≥40% of solved problems were independent",f:"Caps you at B. Volume without understanding does not grade well here."},
    {ok:mustOK,t:"≥80% of MUST problems done",f:"Caps you at C. MUST problems are the level; the rest is garnish."},
    {ok:s.reflected,t:"Reflection written (+15 XP)",f:"It is 15 XP and it is what shapes your next level."}
  ]};
}
const survived=n=>{const s=scoreOf(n);return s.max>0&&s.got>=s.max*SURVIVE_PCT/100;};
const cleared=n=>{const s=scoreOf(n);return s.max>0&&s.got>=s.max*CLEAR_PCT/100;};
function unlocked(n){return n===1||!!S.unlocked[n]||!!S.manual[n]||survived(n-1);}
function refreshUnlocks(){let ch=[];for(let n=2;n<=ROADMAP.length;n++){
  if(!S.unlocked[n]&&survived(n-1)){S.unlocked[n]=true;ch.push(n);} } return ch;}
function campaignXP(){let t=0;for(let n=1;n<=ROADMAP.length;n++)if(S.levels[n])t+=scoreOf(n).got;return t;}
function metaLevel(x){return Math.floor(x/1500)+1;}
function streak(){let n=1,run=0,best=0;
  for(n=1;n<=ROADMAP.length;n++){ if(S.levels[n]&&survived(n)){run++;best=Math.max(best,run);} else if(S.levels[n]&&Object.keys(S.levels[n]).some(k=>["c","lec","pr"].includes(k)&&Object.keys(S.levels[n][k]).length)){run=0;} }
  // current streak = trailing run of survived levels up to the last attempted one
  let last=0;for(let i=1;i<=ROADMAP.length;i++)if(S.levels[i]&&scoreOf(i).got>0)last=i;
  let cur=0;for(let i=last;i>=1;i--){if(survived(i))cur++;else break;}
  return {cur,best};
}
function clearedCount(){let c=0;for(let n=1;n<=ROADMAP.length;n++)if(S.levels[n]&&cleared(n))c++;return c;}

/* ---------- spaced revision (carries across levels) ---------- */
function schedule(name,n){if(S.reviews.some(r=>r.p===name))return;
  S.reviews.push({id:Math.random().toString(36).slice(2,9),p:name,n,base:iso(today()),stage:0});}
function unschedule(name){S.reviews=S.reviews.filter(r=>r.p!==name);}
const revDue=r=>r.stage>=3?null:iso(addDays(parseISO(r.base),REVIEW_OFFSETS[r.stage]));
function dueReviews(){const t=iso(today());
  return S.reviews.filter(r=>r.stage<3&&revDue(r)<=t).sort((a,b)=>revDue(a)<revDue(b)?-1:1);}
function doReview(id,pass){const r=S.reviews.find(x=>x.id===id);if(!r)return;
  if(pass){r.stage++;r.base=iso(today());toast(r.stage>=3?("🎓 Retired: "+esc(r.p)+" — passed all three reviews"):("+"+XP.rev+" XP · next review in "+REVIEW_OFFSETS[r.stage]+" days"));}
  else{r.stage=0;r.base=iso(today());toast("Reset to +7 days. That is the system working, not you failing.");}
  save();render();}

/* ---------- achievements ---------- */
function stats(){
  let ind=0,hint=0,std=0,boss=0,mocks=0,builds=0,sRank=0,mvwOnly=0,revPassed=0,concepts=0;
  for(let n=1;n<=ROADMAP.length;n++){ if(!S.levels[n])continue;
    const d=R(n),st=L(n),s=scoreOf(n);
    ind+=s.ind;hint+=s.hint;std+=s.std;concepts+=s.conDone;
    if(st.boss==="clear")boss++;
    if(gradeOf(n).g==="S")sRank++;
    if(survived(n)&&!cleared(n)&&s.reflected)mvwOnly++;
    if(d.tg.includes("Mock")&&st.boss&&st.boss!=="none")mocks++;
    if(d.sd)builds+=s.sdxD;
  }
  revPassed=S.reviews.filter(r=>r.stage>0).length;
  const st2=streak();
  return {ind,hint,std,boss,mocks,builds,sRank,mvwOnly,revPassed,concepts,
    streak:st2.cur,best:st2.best,solved:ind+hint+std,
    indShare:(ind+hint+std)?ind/(ind+hint+std):0};
}
const ACH=[
 {id:"first",e:"🚀",n:"Day One",d:"Clear Level 1",f:s=>cleared(1)},
 {id:"streak4",e:"🔥",n:"Consistent",d:"4 levels in a row at least survived",f:s=>s.best>=4},
 {id:"streak12",e:"🔥",n:"Unbroken",d:"12 levels in a row",f:s=>s.best>=12},
 {id:"streak26",e:"🧊",n:"Half a Year",d:"26 levels in a row",f:s=>s.best>=26},
 {id:"tortoise",e:"🐢",n:"Tortoise",d:"Survive a level on the Minimum Viable Week — showing up beats quitting",f:s=>s.mvwOnly>=1},
 {id:"ind50",e:"🧠",n:"On Your Own",d:"50 problems solved independently",f:s=>s.ind>=50},
 {id:"ind200",e:"🧠",n:"Self-Sufficient",d:"200 problems solved independently",f:s=>s.ind>=200},
 {id:"share70",e:"📈",n:"Ascending",d:"Independent share ≥70% across 40+ solved problems",f:s=>s.solved>=40&&s.indShare>=0.7},
 {id:"boss10",e:"⚔️",n:"Boss Slayer",d:"10 Boss Battles cleared",f:s=>s.boss>=10},
 {id:"srank",e:"🏅",n:"Flawless",d:"Earn your first S rank",f:s=>s.sRank>=1},
 {id:"srank5",e:"👑",n:"Habitual",d:"Five S ranks",f:s=>s.sRank>=5},
 {id:"rev25",e:"🔁",n:"Never Forgets",d:"25 spaced reviews passed",f:s=>s.revPassed>=25},
 {id:"build",e:"🏗️",n:"Architect",d:"First LLD machine-coding build completed",f:s=>s.builds>=1},
 {id:"mock",e:"🎤",n:"Under Fire",d:"First mock interview survived",f:s=>s.mocks>=1},
 {id:"con200",e:"📚",n:"Deep Stack",d:"200 concepts understood",f:s=>s.concepts>=200},
 {id:"half",e:"🗻",n:"Base Camp",d:"Clear 29 levels — the halfway mark",f:s=>clearedCount()>=29}
];
function checkAch(){const s=stats(),newly=[];
  ACH.forEach(a=>{if(a.f(s)&&!S.seenAch[a.id]){S.seenAch[a.id]=iso(today());newly.push(a);}});
  if(newly.length){save();toast("🏆 Trophy unlocked — <b>"+newly.map(a=>a.n).join(", ")+"</b>");}
}

/* ═══════════════════ RENDER ═══════════════════ */
function renderBar(){
  const xp=campaignXP(),st=streak();
  document.getElementById("sMeta").textContent="Lv "+metaLevel(xp);
  document.getElementById("sXp").textContent=xp.toLocaleString()+" XP";
  document.getElementById("sStreak").textContent=st.cur;
  document.getElementById("sCleared").textContent=clearedCount();
  document.getElementById("sCleared").nextSibling.textContent="/"+ROADMAP.length+" cleared";
}

function renderLevel(){
  const n=S.cur, d=R(n), st=L(n), G=gradeOf(n), s=G.s, ph=PHASES[d.ph];
  const from=wkFrom(n), to=addDays(from,6);
  const isUnlocked=unlocked(n);
  const el=document.getElementById("v-level");
  if(!isUnlocked){
    el.innerHTML=`<div class="card" style="text-align:center;padding:50px 24px">
      <div style="font-size:44px">🔒</div>
      <h2 style="margin:12px 0 6px">Level ${n} is locked</h2>
      <div class="mini">Clear <b>Level ${n-1}</b> first — reaching at least the Minimum Viable Week is enough to unlock it.</div>
      <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="primary" onclick="goto(${n-1})">← Go to Level ${n-1}</button>
        <button class="ghost" onclick="forceUnlock(${n})">Unlock anyway</button>
        <button class="ghost" onclick="peek(${n})">👁 Preview contents (read-only)</button>
      </div></div>`;
    return;
  }
  const acc=`var(${pv(d.ph)})`;
  const dueList=dueReviews();
  let h="";

  // HERO
  h+=`<div class="hero" style="--accent:${acc}">
    <div class="heroTop">
      <div class="lvlbadge">
        <div class="lvlnum" style="background:${acc};box-shadow:0 6px 22px color-mix(in srgb,${acc} 40%,transparent)"><small>LEVEL</small><b>${n}</b></div>
        <div><div class="lvltitle">${esc(d.t)}</div>
          <div class="lvlmeta">Week ${n} · ${fmt(from)} – ${fmt(to)} · ${esc(ph.short)} · <b>${d.hrs} h planned</b></div>
          <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${d.tg.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
        </div>
      </div>
      <div class="pips">
        <div class="pip"><div class="v">${streak().cur}</div><div class="l">🔥 Streak</div></div>
        <div class="pip"><div class="v">${G.g||"—"}</div><div class="l">Grade</div></div>
        <div class="pip"><div class="v">${Math.round(G.pct)}%</div><div class="l">Complete</div></div>
      </div>
    </div>
    <div class="xpwrap">
      <div class="xpbar"><i style="width:${Math.min(100,100*s.got/s.max)}%"></i></div>
      <div class="marks">${[[SURVIVE_PCT,"survived"],[CLEAR_PCT,"cleared"],[S_PCT,"S-rank"]].map(([p,l])=>
        `<span style="left:${p}%">${l} · ${Math.round(s.max*p/100)}</span>`).join("")}</div>
      <div class="xpline"><span><b>${s.got}</b> XP this level${s.bonusXP?` <span style="color:var(--gold)">(+${s.bonusXP} bonus)</span>`:""}</span>
        <span>clear at <b>${Math.round(s.max*CLEAR_PCT/100)}</b> · max <b>${s.max}</b></span></div>
    </div>
    <div class="navrow">
      ${n>1?`<button onclick="goto(${n-1})">← Level ${n-1}</button>`:""}
      <button ${!unlocked(n+1)||n>=ROADMAP.length?"disabled":""} onclick="goto(${n+1})">${n>=ROADMAP.length?"Campaign complete":unlocked(n+1)?`Level ${n+1} →`:`🔒 Level ${n+1}`}</button>
      <button onclick="setView('v-map')">🗺️ Campaign map</button>
      ${cleared(n)?'<span class="stat" style="background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good)">✓ Level cleared</span>':survived(n)?'<span class="stat" style="background:color-mix(in srgb,var(--warn) 16%,transparent)">Survived — streak holds</span>':''}
    </div>
  </div>`;

  // MAIN QUEST
  h+=`<div class="card" style="border-color:color-mix(in srgb,${acc} 40%,transparent)">
    <h2 class="sec">⭐ Main Quest</h2>
    <div style="font-size:16px;font-weight:650;line-height:1.45">${esc(d.g)}</div></div>`;
  const sr=speedrunFor(n); if(sr) h+=`<div class="note gold">${sr}</div>`;

  // DSA QUESTS
  const ck=(arr,key)=>arr.map((t,i)=>
    `<label class="ck ${st[key][i]?"on":""}"><input type="checkbox" ${st[key][i]?"checked":""} onchange="tick('${key}',${i},this.checked)"><span class="t">${esc(t)}</span></label>`).join("");
  let b=`<h2 class="sec">Concepts — tick when you <i>understand</i> it, not when you have read it <span style="color:var(--ink-2)">(${s.conDone}/${s.conTot})</span></h2>
    <div class="grid2">${ck(d.c,"c")}</div>`;
  if(d.pt&&d.pt.length) b+=`<h2 class="sec" style="margin-top:18px">Patterns to recognise</h2><div class="mini">`+d.pt.map(p=>"• "+esc(p)).join("<br>")+`</div>`;
  b+=`<h2 class="sec" style="margin-top:18px">Lectures — one source only <span style="color:var(--ink-2)">(${s.lecDone}/${s.lecTot})</span></h2>`+
    d.lec.map((l,i)=>`<label class="ck ${st.lec[i]?"on":""}"><input type="checkbox" ${st.lec[i]?"checked":""} onchange="tick('lec',${i},this.checked)"><span class="t"><b>${esc(l[0])}</b> — ${esc(l[1])}</span></label>`).join("");
  b+=`<h2 class="sec" style="margin-top:18px">Problems <span style="color:var(--ink-2)">(${s.done}/${s.total} · must ${s.mustDone}/${s.musts})</span></h2>`;
  b+=d.pr.map((p,i)=>{const e=st.pr[i];
    return `<div class="prow ${e?"on":""}">
      <input type="checkbox" ${e?"checked":""} onchange="tickProb(${i},this.checked)">
      <span class="tag t-${TIER[p[2]]}">${TIER[p[2]]}</span><span class="t-${p[1]}">${p[1]}</span>
      <span class="pn">${esc(p[0])}</span>
      <select class="out" ${e?"":"disabled"} onchange="setOut(${i},this.value)">
        <option value="ind"${e==="ind"?" selected":""}>solved independently</option>
        <option value="hint"${e==="hint"?" selected":""}>needed a hint</option>
        <option value="std"${e==="std"?" selected":""}>studied the solution</option></select>
      ${findLinkHTML(p[0])}
      <span class="xpgain">${e?"+"+probXP(p,e):"+"+probMax(p)}</span></div>`;}).join("");
  b+=`<div class="mini" style="margin-top:9px">Every <b>MUST</b> problem you tick joins the spaced-revision queue at +7 / +30 / +90 days — it will reappear in a later level's Revision Quests.</div>`;
  h+=block("⚔️",acc,"DSA Quests",`${d.c.length} concepts · ${d.lec.length} lecture${d.lec.length>1?"s":""} · ${d.pr.length} problems`,
    d.c.length*XP.concept+d.lec.length*XP.lecture+d.pr.reduce((a,p)=>a+probMax(p),0),b);

  // SYSTEM DESIGN
  if(d.sd){
    let sb=`<h2 class="sec">${esc(d.sd.h)} — concepts <span style="color:var(--ink-2)">(${s.sdcD}/${s.sdcT})</span></h2><div class="grid2">${ck(d.sd.c,"sdc")}</div>`;
    sb+=`<h2 class="sec" style="margin-top:18px">Hands-on exercises <span style="color:var(--ink-2)">(${s.sdxD}/${s.sdxT})</span> — 25 XP each</h2><div>${ck(d.sd.x,"sdx")}</div>`;
    h+=block("🏗️","var(--violet)","System Design Quests",esc(d.sd.h),s.sdcT*XP.sdc+s.sdxT*XP.sdx,sb);
  }else{
    const unlockAt=ROADMAP.findIndex(x=>x.sd)+1;
    h+=block("🏗️","var(--violet)","System Design Quests","Locked until Level "+unlockAt,0,
      `<div class="mini">🔒 System Design quests unlock at <b>Level ${unlockAt}</b>, once DSA has had ${unlockAt-1} uninterrupted weeks. LLD joins first (OOP → SOLID → patterns → machine coding), then HLD at Level 46. Running three tracks now would make all three shallow.</div>`,true);
  }

  // REVISION
  let rb="";
  if(d.rv&&d.rv.length) rb+=`<h2 class="sec">This level's revision targets <span style="color:var(--ink-2)">(${s.revDone}/${s.revTot})</span></h2><div>${ck(d.rv,"rev")}</div>`;
  rb+=`<h2 class="sec" style="margin-top:16px">Spaced queue — due now <span style="color:var(--ink-2)">(${dueList.length})</span></h2>`;
  rb+= dueList.length
    ? `<table><tr><th>Problem</th><th>From</th><th>Stage</th><th>Due</th><th></th></tr>`+
      dueList.map(r=>`<tr><td><b>${esc(r.p)}</b></td><td class="mini">L${r.n}</td><td class="mini">${STAGE_LABEL[r.stage]}</td>
      <td class="mini">${revDue(r)}</td><td style="white-space:nowrap">
      <button onclick="doReview('${r.id}',true)">Re-solved ✓</button>
      <button onclick="doReview('${r.id}',false)">Failed ✗</button></td></tr>`).join("")+`</table>
      ${dueList.length>12?'<div class="note red" style="margin-top:10px"><b>Queue overflow.</b> More than 12 due. Clear these before starting this level\'s new problems — a backed-up queue is the single best predictor of the whole plan failing.</div>':''}`
    : `<div class="mini">Nothing due. ${S.reviews.length?"Queue holds "+S.reviews.filter(r=>r.stage<3).length+" problems.":"It fills up as you tick MUST problems."}</div>`;
  h+=block("🔁","var(--gold)","Revision Quests",`${dueList.length} due now`,s.revTot*XP.rev,rb);

  // DAILY MISSIONS
  const ms=missionsFor(n);
  let mb=`<div class="days">`+ms.map((m,i)=>
    `<div class="day ${st.ms[i]?"on":""}" onclick="tick('ms',${i},${!st.ms[i]})"><span class="tick">${st.ms[i]?"✓":""}</span><div class="d">${m[0]}</div><div class="m">${esc(m[1])}</div></div>`).join("")+`</div>
    <div class="mini" style="margin-top:10px">Mon–Thu ≈ 2 h · Fri ≈ 1 h · Sat 3–4 h · Sun 2–3 h → <b>${d.hrs} h planned</b>. Tick a day when you did something real on it, not when it was perfect.</div>`;
  h+=block("📅",acc,"Daily Missions",`${s.msDone}/7 days`,7*XP.mission,mb);

  // BONUS
  const bq=bonusFor(n);
  let bb2=bq.map((x,i)=>`<label class="ck ${st.bonus[i]?"on":""}"><input type="checkbox" ${st.bonus[i]?"checked":""} onchange="tick('bonus',${i},this.checked)"><span class="t">${esc(x[0])} <span class="dim">+${x[1]} XP</span></span></label>`).join("")
    +`<div class="mini" style="margin-top:8px">Bonus XP sits <b>outside</b> the level total — it can push you past 100%, but it can never rescue a missed MUST problem.</div>`;
  h+=block("✨","var(--p4)","Bonus Quests","only if you have energy left",bq.reduce((a,x)=>a+x[1],0),bb2);

  // BOSS
  h+=`<div class="boss">
    <h2 class="sec" style="color:var(--red)">⚔️ Boss Battle <span class="dim" style="text-transform:none;letter-spacing:0">— +110 XP cleared / +40 attempted</span></h2>
    <div style="font-size:15px;font-weight:600;line-height:1.45">${esc(d.bb)}</div>
    <div class="mini" style="margin-top:8px">Cleared = you met the bar first time, unaided. Attempted = you got there, but needed a second run or a look at something. Be strict — a grade gate depends on this.</div>
    <div class="seg">${[["none","Not started"],["attempt","Attempted"],["clear","Cleared ⚔️"]].map(([k,l])=>
      `<button class="${(st.boss||"none")===k?"on":""}" onclick="setBoss('${k}')">${l}</button>`).join("")}</div></div>`;

  // MVW
  h+=`<div class="mvw"><h2 class="sec" style="color:var(--warn)">🛟 Minimum Viable Week</h2>
    <div class="mini" style="margin-bottom:8px">Brutal week at Formbay? Do <b>only</b> these. The level counts as survived, the streak holds, the next level still unlocks, and nothing rolls over.</div>
    ${(d.mv||[]).map(m=>`<div class="ck" style="cursor:default">▸ <span class="t">${esc(m)}</span></div>`).join("")}
    <div class="mini" style="margin-top:10px"><b>Floor rule:</b> on any single impossible day, 25 minutes counts — one problem, or one page of notes re-read plus one template typed from memory. Never zero. Zero is how streaks die.</div></div>`;

  // DoD + grade
  h+=`<div class="card" style="border-left:3px solid var(--good)">
    <h2 class="sec" style="color:var(--good)">✅ Definition of Done</h2>
    <div style="font-size:14.5px">${esc(d.dod)}</div></div>`;

  h+=`<div class="card"><h2 class="sec">🎯 Weekly Score</h2>
    <div class="gradebox"><div class="gradeltr ${G.g?"g"+G.g:""}">${G.g||"—"}</div>
      <div style="flex:1;min-width:250px">
        <div class="mini" style="margin-bottom:8px"><b>${s.got} XP</b> · ${Math.round(G.pct)}% ·
          ${cleared(n)?'<span class="pass">level cleared ✓</span>':survived(n)?'<span style="color:var(--warn)">survived — streak holds</span>':'<span class="fail">below the survival line</span>'}</div>
        ${G.gates.map(g=>`<div class="gate"><b class="${g.ok?"pass":"fail"}">${g.ok?"✓":"✕"}</b><span>${g.t}${g.ok?"":' — <span class="dim">'+g.f+'</span>'}</span></div>`).join("")}
        <div class="mini" style="margin-top:10px">S 92% · A 80% · B 65% · C 45% · D below.</div>
      </div></div>
    <details style="margin-top:14px"><summary class="mini" style="cursor:pointer">XP table — what earns what</summary>
    <table style="margin-top:10px">
      <tr><th>Action</th><th class="num">XP</th><th>Notes</th></tr>
      <tr><td>Concept understood</td><td class="num">5</td><td class="dim">—</td></tr>
      <tr><td>Lecture completed</td><td class="num">12</td><td class="dim">—</td></tr>
      <tr><td>Easy / Medium / Hard problem</td><td class="num">15 / 25 / 40</td><td class="mini">× 1.5 independent · × 1.0 hint · × 0.6 studied</td></tr>
      <tr><td>MUST-tier bonus</td><td class="num">+5</td><td class="dim">per problem, on top</td></tr>
      <tr><td>Spaced review passed</td><td class="num">20</td><td class="dim">—</td></tr>
      <tr><td>Design concept / exercise</td><td class="num">5 / 25</td><td class="dim">—</td></tr>
      <tr><td>Daily mission</td><td class="num">5</td><td class="dim">× 7</td></tr>
      <tr><td>Boss Battle</td><td class="num">110</td><td class="dim">40 if only attempted</td></tr>
      <tr><td>Reflection written</td><td class="num">15</td><td class="dim">—</td></tr>
    </table>
    <div class="note" style="margin-top:12px"><b>Why understanding beats volume.</b> A Hard problem you had to read the solution for earns 24 XP. An Easy one you cracked alone earns 22. That is deliberate — and the gates above mean no amount of grinding buys an A while the boss is unbeaten or most of your solves came from editorials.</div>
    </details></div>`;

  // REFLECTION
  h+=`<div class="card"><h2 class="sec">🪞 Reflection <span class="dim" style="text-transform:none;letter-spacing:0">— +15 XP, and it writes your report</span></h2>
    <div class="grid2" style="gap:12px 18px">
      <div><label class="mini">Hours actually studied</label><br><input type="number" step="0.5" min="0" id="rHours" value="${esc(st.hours||"")}" onchange="setF('hours',this.value)" style="width:110px"></div>
      <div><label class="mini">Time available next week</label><br><select id="rTime" onchange="setF('time',this.value)">
        ${["Normal","Busy","Light"].map(o=>`<option ${st.time===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div><label class="mini">How hard did this level feel? (1 easy – 5 brutal)</label><br><select onchange="setF('diff',this.value)">
        <option value="">—</option>${[1,2,3,4,5].map(i=>`<option ${String(st.diff)===String(i)?"selected":""}>${i}</option>`).join("")}</select></div>
      <div><label class="mini">Confidence on this topic now (1–5)</label><br><select onchange="setF('conf',this.value)">
        <option value="">—</option>${[1,2,3,4,5].map(i=>`<option ${String(st.conf)===String(i)?"selected":""}>${i}</option>`).join("")}</select></div>
    </div>
    <div style="margin-top:12px">
      <label class="mini">What went well?</label><textarea onchange="setF('well',this.value)">${esc(st.well||"")}</textarea>
      <label class="mini">What was difficult?</label><textarea onchange="setF('hard',this.value)">${esc(st.hard||"")}</textarea>
      <label class="mini">What did you skip, and why?</label><textarea onchange="setF('skip',this.value)">${esc(st.skip||"")}</textarea>
      <label class="mini">Where exactly did you struggle? (specific — this drives the next level)</label><textarea onchange="setF('struggle',this.value)">${esc(st.struggle||"")}</textarea>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="primary" onclick="buildReport()">Generate my Level report →</button>
      <button onclick="copyReport()">Copy</button>
      <span class="mini">Paste into Claude with “<b>Generate Level ${n+1}</b>”.</span></div>
    <textarea class="report" id="reportOut" style="margin-top:12px" readonly placeholder="Your report will appear here…"></textarea></div>`;

  el.innerHTML=h;
}
function block(icon,color,title,sub,xp,body,locked){
  return `<div class="quest ${locked?"locked":""}"><div class="qhead" onclick="this.parentNode.querySelector('.qbody').style.display=this.parentNode.querySelector('.qbody').style.display==='none'?'':'none'">
    <div class="qicon" style="background:color-mix(in srgb,${color} 22%,transparent)">${icon}</div>
    <div class="qtitle">${title}${sub?`<small>${sub}</small>`:""}</div>
    ${xp?`<div class="qxp">up to ${xp} XP</div>`:""}</div>
    <div class="qbody">${body}</div></div>`;
}

/* ── CAMPAIGN MAP ── */
function renderMap(){
  const el=document.getElementById("v-map");
  const st=stats();
  let h=`<div class="card"><h2 class="sec">🗺️ Campaign</h2>
    <div class="mini">Levels unlock one at a time. Reaching the <b>Minimum Viable Week</b> on a level is enough to open the next — you never have to be perfect to move forward, you only have to show up.
    Locked levels show their title so you can see what is coming, but their quests stay sealed.</div>
    <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap" class="mini">
      <span>🏆 <b>${clearedCount()}</b> cleared</span><span>🔓 <b>${Object.keys(S.unlocked).length}</b> unlocked</span>
      <span>🔥 best streak <b>${st.best}</b></span><span>🧠 <b>${st.ind}</b> independent solves</span>
      <span>⚡ <b>${campaignXP().toLocaleString()}</b> campaign XP</span></div></div>`;
  PHASES.forEach(p=>{
    const lv=ROADMAP.filter(x=>x.ph===p.i);
    const done=lv.filter(x=>cleared(x.n)).length;
    h+=`<div class="chapter"><div class="chTitle"><span class="chDot" style="background:var(${p.v})"></span>
      <span class="chName">${esc(p.name)}</span><span class="chMeta">${done}/${lv.length} cleared · Levels ${lv[0].n}–${lv[lv.length-1].n}</span></div>
      <div class="tiles">`;
    lv.forEach(x=>{
      const u=unlocked(x.n), c=cleared(x.n), sv=survived(x.n), g=gradeOf(x.n), cur=x.n===S.cur;
      const pct=g.s.max?Math.min(100,100*g.s.got/g.s.max):0;
      h+=`<div class="tile ${u?"":"lock"} ${c?"done":""} ${cur?"cur":""}" style="--accent2:var(${p.v})" onclick="${u?`goto(${x.n})`:(S.admin?`peek(${x.n})`:`lockMsg(${x.n})`)}">
        ${u?"":'<span class="lockico">🔒</span>'}
        <div class="tn" style="color:var(${p.v})">LEVEL ${x.n}</div>
        <div class="tt">${esc(x.t)}</div>
        <div class="tb">
          ${g.g?`<span class="gbadge g${g.g}">${g.g}</span>`:""}
          ${c?'<span class="chip" style="background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)">cleared</span>':sv?'<span class="chip" style="background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)">survived</span>':""}
          ${x.tg.includes("Mock")?'<span class="chip">mock</span>':""}
          ${x.tg.includes("Deload")?'<span class="chip">deload</span>':""}
          ${cur?'<span class="chip" style="background:color-mix(in srgb,var(--blue) 25%,transparent);color:var(--blue)">current</span>':""}
        </div>
        ${u&&pct>0?`<div class="pbar"><i style="width:${pct}%"></i></div>`:""}
      </div>`;
    });
    h+=`</div></div>`;
  });

/* ═══════════ PROBLEM LOOKUP LINKS ═══════════
   Some entries are drills ("2 unseen Mediums in 60 min") with nothing to look up, and
   many carry annotations that poison a search query. And target="_blank" is blocked in
   sandboxed embeds, so a click that cannot open a tab falls back to a copyable panel. */
const DRILL_RE=/unseen|timed set|mixed timed|timed graph set|pattern set|rewrite all|re-read|narrated|recorded|weakest topic|worst topic|loop \d|problems from|\d+\s*min(ute)?s|then stop|editorial allowed|maintenance|implement both|\bdemo\b/i;
const ANNOT_RE=/\s*\((implement|iterative|recursive|revisit[^)]*|as [^)]*|with [^)]*|via [^)]*|using [^)]*|compare[^)]*|analyse[^)]*|bitmask[^)]*|custom comparator|bucket sort|stack (approach|version)|binary search version|expand around centre|loop, then formula|log n|TUF\+|Kadane|Dutch National Flag|Kosaraju|XOR approach|equal 0s and 1s|a\^b mod m|Prefix Tree|Uber routing uses it|[^)]*approach(es)?|[^)]*version)\)\s*$/i;
function cleanQuery(n){
  let q=n.replace(/^Re-solve:\s*/i,"").replace(ANNOT_RE,"");
  // drop an em-dash aside, then any dangling half-open parenthesis it left behind
  q=q.replace(/\s+—.*$/,"");
  const o=(q.match(/\(/g)||[]).length, c=(q.match(/\)/g)||[]).length;
  if(o>c) q=q.slice(0,q.lastIndexOf("("));
  return q.replace(/[\s,;:–-]+$/,"").replace(/\s{2,}/g," ").trim();
}
function isDrill(n){
  if(DRILL_RE.test(n)) return true;
  const q=cleanQuery(n);
  return q.length<4 || DRILL_RE.test(q);
}
function linksFor(name){
  const q=cleanQuery(name), e=encodeURIComponent(q);
  const tuf=/TUF\+|pattern/i.test(name);
  return {q, tuf,
    LeetCode:"https://leetcode.com/problemset/?search="+e,
    "TUF+":"https://takeuforward.org/plus/dsa/all-problems?search="+e,
    Google:"https://www.google.com/search?q="+encodeURIComponent(q+" leetcode")};
}
function findLinkHTML(name){
  if(isDrill(name)) return '<span class="mini dim" title="A drill, not a specific problem — nothing to look up">drill</span>';
  const L=linksFor(name), primary=L.tuf?L["TUF+"]:L.LeetCode;
  return '<a class="mini" style="color:var(--blue)" href="'+primary+'" target="_blank" rel="noopener noreferrer" '+
         'onclick="return findClick(event,\''+name.replace(/'/g,"\\'").replace(/"/g,"&quot;")+'\')">find ↗</a>';
}
function findClick(ev,name){
  const L=linksFor(name), primary=L.tuf?L["TUF+"]:L.LeetCode;
  let w=null; try{ w=window.open(primary,"_blank","noopener"); }catch(e){}
  if(w){ ev.preventDefault(); return false; }        // opened fine
  ev.preventDefault(); showLinks(name); return false; // blocked here — offer copyable URLs
}
function copyText(t){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove();
  if(!ok&&navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Link copied."),()=>toast("Could not copy — select the text manually."));
  else toast(ok?"Link copied.":"Could not copy — select the text manually.");
}
function showLinks(name){
  const L=linksFor(name);
  const row=(label,url)=>'<div style="display:flex;gap:8px;align-items:center;margin-top:7px">'+
    '<a href="'+url+'" target="_blank" rel="noopener noreferrer" style="color:var(--blue);font-weight:650;min-width:76px">'+label+' ↗</a>'+
    '<button onclick="copyText(\''+url.replace(/'/g,"\\'")+'\')" style="font-size:11.5px;padding:4px 9px">Copy link</button></div>';
  dlgOpen({title:"Find: "+L.q, noCancel:true, ok:"Close",
    msg:"This viewer blocks new tabs, so the link could not open by itself. Copy one of these and paste it into a browser tab:"+
        row("LeetCode",L.LeetCode)+row("TUF+",L["TUF+"])+row("Google",L.Google)+
        '<div class="mini dim" style="margin-top:12px">Opening the tracker file directly in a browser tab makes these links clickable as normal.</div>',
    input:true, value:L.tuf?L["TUF+"]:L.LeetCode});
}

const clone=o=>JSON.parse(JSON.stringify(o||{}));
function takeSnapshot(){
  const wasUnlocked={};
  for(let n=1;n<=ROADMAP.length;n++) if(unlocked(n)) wasUnlocked[n]=true;
  S.snap={at:iso(today()),cur:S.cur,wasUnlocked,levels:clone(S.levels),reviews:clone(S.reviews),seenAch:clone(S.seenAch)};
}
function enableAdmin(){
  S.admin=true; takeSnapshot(); save(); syncAdminUI(); render();
  toast("⚙ Admin mode on — a snapshot was taken. Anything you change behind a lock is rolled back when you leave.");
}
/* What would be thrown away if admin ended right now? */
function sandboxDiff(){
  const snap=S.snap; if(!snap) return {discard:[],forced:[]};
  const discard=[], forced=Object.keys(S.manual||{}).map(Number).filter(n=>S.manual[n]);
  const built={};
  for(let n=1;n<=ROADMAP.length;n++){
    const legit = n===1 || survivedState(built,n-1);
    const keep = !!snap.wasUnlocked[n] || legit;
    built[n] = keep ? (S.levels[n]||{}) : (snap.levels[n]||{});
    if(!keep){
      const now=JSON.stringify(S.levels[n]||{}), then=JSON.stringify(snap.levels[n]||{});
      if(now!==then) discard.push(n);
    }
  }
  return {discard,forced,built};
}
/* survived() but evaluated against an arbitrary levels map */
function survivedState(map,n){
  const saved=S.levels; S.levels=map;
  let r=false; try{ r=survived(n); } finally { S.levels=saved; }
  return r;
}
async function toggleAdminOff(){
  const snap=S.snap;
  if(snap){
    const d=sandboxDiff();
    if(d.discard.length){
      const names=d.discard.slice(0,6).map(n=>"L"+n+" "+R(n).t).join("<br>")+(d.discard.length>6?"<br>…and "+(d.discard.length-6)+" more":"");
      const ok=await uiConfirm("Leave admin and roll back?",
        "You changed <b>"+d.discard.length+" level"+(d.discard.length>1?"s":"")+"</b> that were locked when you entered admin mode:<br><br>"+names+
        "<br><br>Admin is a sandbox. Leaving it <b>discards those changes</b> and re-locks those levels — you come back to exactly where you were working before."+
        "<br><br>Anything you did on levels that were already open, and any level you legitimately earned along the way, is kept.",
        "Discard and leave admin");
      if(!ok){toast("Still in admin mode.");return;}
    }
    // roll back: locked-at-entry levels revert to their snapshot, everything else stays
    const keptLevels=new Set();
    const built={};
    for(let n=1;n<=ROADMAP.length;n++){
      const legit = n===1 || survivedState(built,n-1);
      const keep = !!snap.wasUnlocked[n] || legit;
      if(keep){keptLevels.add(n); built[n]=S.levels[n]||{};}
      else { if(snap.levels[n]) built[n]=clone(snap.levels[n]); }
    }
    S.levels=built;
    // reviews: current ones for kept levels, snapshot ones for rolled-back levels
    const rev=S.reviews.filter(r=>keptLevels.has(r.n));
    (snap.reviews||[]).forEach(r=>{ if(!keptLevels.has(r.n)) rev.push(clone(r)); });
    S.reviews=rev;
    S.seenAch=clone(snap.seenAch);
    S.manual={}; S.unlocked={1:true}; refreshUnlocks();
    if(!unlocked(S.cur)) S.cur = unlocked(snap.cur)?snap.cur:(function(){let f=1;for(let n=1;n<=ROADMAP.length;n++)if(unlocked(n))f=n;return f;})();
    delete S.snap;
    S.admin=false; peekLevel=0; if(view==="v-adm")view="v-level";
    save(); checkAch(); syncAdminUI(); render();
    const bits=[];
    if(d.forced.length) bits.push(d.forced.length+" force-unlocked level"+(d.forced.length>1?"s":"")+" re-locked");
    if(d.discard.length) bits.push("changes to "+d.discard.length+" locked level"+(d.discard.length>1?"s":"")+" rolled back");
    toast(bits.length?("Admin mode off — "+bits.join(", ")+". You are back on Level "+S.cur+"."):"Admin mode off — back to one level at a time.");
    return;
  }
  S.manual={}; S.unlocked={1:true}; refreshUnlocks();
  if(!unlocked(S.cur)){let f=1;for(let n=1;n<=ROADMAP.length;n++)if(unlocked(n))f=n;S.cur=f;}
  S.admin=false; peekLevel=0; if(view==="v-adm")view="v-level";
  save(); syncAdminUI(); render(); toast("Admin mode off — back to one level at a time.");
}

      <span class="ln" style="color:var(${p.v})">L${d.n}</span>
      <span class="lt">${esc(d.t)}<small>${esc(d.g)}</small></span>
      <span class="lm">${u?"🔓":"🔒"} ${d.hrs} h · ${d.pr.length}p · ${d.c.length}c${g.g?" · "+g.g:""}</span>
    </summary><div class="db">${levelDetailHTML(d.n)}
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="peek(${d.n})">👁 Open as a full preview</button>
        ${u?`<button class="primary" onclick="peekLevel=0;goto(${d.n})">Play Level ${d.n}</button>`:`<button class="ghost" onclick="forceUnlock(${d.n})">Unlock it</button>`}
      </div></div></details>`;
  });
  h+=`</div>`;
  document.getElementById("v-adm").innerHTML=h;
}
function admToggleAll(v){document.querySelectorAll("#admList details").forEach(d=>d.open=v);}

/* ── curriculum exports ── */
function syllabusMD(){
  const L=[];
  L.push("# The Long Game — full syllabus");
  L.push("");
  L.push(`${ROADMAP.length} levels · ${PHASES.length} phases · ${ROADMAP.reduce((a,d)=>a+d.hrs,0)} planned hours · ` +
         `${ROADMAP.reduce((a,d)=>a+d.pr.length,0)} problems (${ROADMAP.reduce((a,d)=>a+d.pr.filter(x=>x[2]===1).length,0)} MUST) · ` +
         `${ROADMAP.reduce((a,d)=>a+d.c.length,0)} concepts`);
  L.push("");
  PHASES.forEach(p=>{
    const lv=ROADMAP.filter(d=>d.ph===p.i);
    L.push(`## ${p.name}  (Levels ${lv[0].n}–${lv[lv.length-1].n})`);L.push("");
    lv.forEach(d=>{
      L.push(`### Level ${d.n} — ${d.t}`);
      L.push(`*Week ${d.n} · ${fmt(wkFrom(d.n))} – ${fmt(addDays(wkFrom(d.n),6))} · ${d.hrs} h · ${d.tg.join(", ")}*`);L.push("");
      L.push(`**Primary goal.** ${d.g}`);L.push("");
      L.push("**Concepts**");d.c.forEach(x=>L.push("- "+x));L.push("");
      if(d.pt&&d.pt.length){L.push("**Patterns**");d.pt.forEach(x=>L.push("- "+x));L.push("");}
      L.push("**Lectures**");d.lec.forEach(x=>L.push(`- **${x[0]}** — ${x[1]}`));L.push("");
      L.push("**Problems**");
      [[1,"Must solve"],[2,"Recommended"],[3,"Bonus"]].forEach(([t,lab])=>{
        const li=d.pr.filter(x=>x[2]===t); if(!li.length)return;
        L.push(`- *${lab}:*`); li.forEach(x=>L.push(`  - [${x[1]}] ${x[0]}`));});
      L.push("");
      if(d.sd){L.push(`**${d.sd.h} — concepts**`);d.sd.c.forEach(x=>L.push("- "+x));L.push("");
               L.push("**Exercises**");d.sd.x.forEach(x=>L.push("- "+x));L.push("");}
      if(d.rv&&d.rv.length){L.push("**Revision**");d.rv.forEach(x=>L.push("- "+x));L.push("");}
      L.push("**Daily missions**");missionsFor(d.n).forEach(m=>L.push(`- ${m[0]} — ${m[1]}`));L.push("");
      L.push(`**⚔️ Boss battle.** ${d.bb}`);L.push("");
      L.push("**🛟 Minimum viable week**");(d.mv||[]).forEach(x=>L.push("- "+x));L.push("");
      L.push(`**✅ Definition of done.** ${d.dod}`);L.push("");L.push("---");L.push("");
    });
  });
  return L.join("\n");
}

function render(){renderBar();
  if(view==="v-level"){ if(peekLevel && S.admin) renderPeek(); else { peekLevel=0; renderLevel(); } }
  else if(view==="v-map")renderMap();
  else if(view==="v-adm")renderAdmin();
  else renderAch();}

refreshUnlocks();
if(location.hash.toLowerCase().indexOf('admin')>=0&&!S.admin){S.admin=true;takeSnapshot();save();}

syncAdminUI();
// jump to the furthest unlocked level on first open of a session
(function(){let f=1;for(let n=1;n<=ROADMAP.length;n++)if(unlocked(n))f=n;
  if(!S.levels[S.cur]||scoreOf(S.cur).got===0)S.cur=Math.max(S.cur||1,1);
  if(f>1&&(!S.cur||S.cur<1))S.cur=f;})();

  document.getElementById("storeNote").appendChild(n);}
